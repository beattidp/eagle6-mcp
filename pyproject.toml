[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle6-mcp"
version = "0.1.0"
description = "MCP server for CadSoft EAGLE v6.6.0 schematic and PCB design review"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "lxml>=6.0.0",
    "pydantic>=2.10.0",
]

[project.scripts]
eagle6-mcp = "eagle6_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
